name: Clinic CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: clinic-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CLINIC_DB: ':memory:'
      CLINIC_DEMO: '1'
      CLINIC_DEMO_ONLY: '1'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
        env:
          CLINIC_TEST_POSTGRES: '1'
          DATABASE_URL: postgresql://clinic:disposable-ci-only@127.0.0.1:5432/clinic_test
      - run: CLINIC_SECURITY_ACCEPTANCE=1 npm run test:audit
      - run: npm run test:financial-recovery
      - run: npm run test:concurrency-http
        env:
          DATABASE_URL: postgresql://clinic:disposable-ci-only@127.0.0.1:5432/clinic_test
      - run: shellcheck -s sh infra/*.sh infra/postgres/*.sh
      - run: npm run build
